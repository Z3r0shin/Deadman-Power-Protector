; Bench node firmware: Arduino on the ESP32-S3. Decisions in src/bench_core.h (tests: make -C test).
; Pinned to the platform already installed on the build PC; do not update.
[env:bench]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
; two 6.25 MB app slots, so the firmware can update itself over WiFi
board_build.partitions = default_16MB.csv
monitor_speed = 115200
extra_scripts = pre:scripts/page.py, pre:scripts/version.py
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -Wall
